name: Feature Request
description: Suggest a new capability or an improvement to an existing one.
title: "Feature: "
labels: ["functionality"]
body:

  - type: markdown
    attributes:
      value: |
        > [!TIP]
        > Please search the [existing issues](https://github.com/cechout/fluent-sensors/issues?q=is%3Aissue) first, and add to an existing one rather than opening a duplicate.

        This is a solo hobby project, so not every request can be built. Describing the problem rather than the solution makes it much easier to find something that fits.

  - type: textarea
    id: description
    attributes:
      label: What would you like to see
      description: Describe the feature or the change.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve
      description: What are you trying to do today, and where does the app get in the way?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to reach the same result, including how other monitoring tools handle it.
    validations:
      required: false
