# builds the win-x64 installer plus the portable zip and drafts a GitHub release whenever a version tag is pushed
# csproj Version is the single source of truth, Inno Setup receives it as a command line define
# the store job then hands the msix to the microsoft store, see the comment above it
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: setup msbuild
        uses: microsoft/setup-msbuild@v3

      # reads the version once so the csproj stays the only place it gets bumped by hand
      - name: read version from csproj
        id: version
        shell: pwsh
        run: |
          $xml = [xml](Get-Content FluentSensors/FluentSensors.csproj)
          $version = $xml.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$version" >> $env:GITHUB_OUTPUT

      # --- workaround: dotnet build cannot resolve COMReference ---
      # problem: ResolveComReference is not implemented in the .NET Core version of MSBuild, only
      # the full .NET Framework MSBuild (msbuild.exe) supports it, dotnet build/publish fail with MSB4803
      # https://aka.ms/msbuild/MSB4803
      # fix: restore via dotnet CLI as usual, then build/publish through msbuild.exe from microsoft/setup-msbuild
      - name: restore
        run: dotnet restore FluentSensors/FluentSensors.csproj -p:Platform=x64 -r win-x64 -p:SelfContained=true

      # WinUI3 x:Bind on types defined in this project (like SourceLink) needs a full Build pass
      # first, so MarkupCompilePass2 gets the LocalAssembly it resolves them against, otherwise the
      # XAML compiler fails on a from-scratch checkout with no prior obj state (WMC0909/WMC9999)
      - name: build win-x64
        run: msbuild FluentSensors/FluentSensors.csproj -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true

      # uses the real FolderProfile.pubxml (Properties/PublishProfiles) so CI applies the exact same
      # settings as a local Visual Studio publish, PublishTrimmed=false included
      - name: publish win-x64
        run: msbuild FluentSensors/FluentSensors.csproj -t:Publish -p:Configuration=Release -p:Platform=x64 -p:PublishProfile=FolderProfile -p:NoBuild=true

      - name: install inno setup
        run: choco install innosetup -y --no-progress

      - name: compile installer
        shell: pwsh
        run: >
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          /DMyAppVersion=${{ steps.version.outputs.version }}
          Setup\Inno_Setup.iss

      # portable variant: the exact same publish output the installer just consumed, staged into its own folder and
      # given the marker file that makes the app store its settings next to the exe instead of in %LocalAppData%
      # staged instead of zipped in place so the marker can never end up in the installer payload
      - name: package portable zip
        shell: pwsh
        run: |
          $staging = "Setup/Output/FluentSensors_Portable_${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -Path "FluentSensors/bin/x64/Release/net10.0-windows10.0.19041.0/publish/win-x64/*" -Destination $staging -Recurse -Force
          Copy-Item -Path "Setup/Portable/portable.txt" -Destination $staging -Force
          Compress-Archive -Path $staging -DestinationPath "$staging.zip" -Force

      - name: upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: FluentSensors_Installer
          path: Setup/Output/FluentSensors_Installer.exe

      - name: upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: FluentSensors_Portable
          path: Setup/Output/FluentSensors_Portable_${{ steps.version.outputs.version }}.zip

      # create draft only
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          Setup/Output/FluentSensors_Installer.exe
          Setup/Output/FluentSensors_Portable_${{ steps.version.outputs.version }}.zip
          --draft --generate-notes --title "FluentSensors ${{ github.ref_name }}"

      # built last, after the draft release already exists: this needs no signing secrets, but it does need the
      # msix packaging targets that ship with visual studio, and if a runner turns out not to carry them then a
      # red step here must not cost the installer, the zip and the release that are already done
      # StoreUpload produces a .msixupload holding an unsigned bundle, which is what partner center takes; the
      # store signs it itself
      # no version is passed: the StampAppxManifestVersion target in the csproj writes it into the manifest
      - name: package msix for the store
        run: >
          msbuild FluentSensors/FluentSensors.csproj -t:Publish
          -p:Configuration=Release -p:Platform=x64
          -p:PublishProfile=FolderProfile
          -p:WindowsPackageType=MSIX
          -p:GenerateAppxPackageOnBuild=true
          -p:UapAppxPackageBuildMode=StoreUpload
          -p:AppxPackageSigningEnabled=false
          "-p:AppxPackageDir=${{ github.workspace }}\Setup\MsixOutput\\"

      # deliberately not a release asset: a .msixupload belongs in partner center and nobody can install it from
      # a release page, so it stays an artifact to pick up by hand
      - name: upload msix artifact
        uses: actions/upload-artifact@v7
        with:
          name: FluentSensors_Store
          path: Setup/MsixOutput/*.msixupload

  # submits the msix to the microsoft store with release notes built from the feat and fix pull requests, so the
  # store version goes into certification while the github release is still a draft
  #
  # the STORE_SUBMISSION repository variable picks what happens, changeable without a commit:
  # draft - uploaded, left in partner center to be submitted there by hand
  # manual - submitted, held after certification until it is published by hand in partner center
  # immediate - submitted, published by the store as soon as certification passes
  # unset or anything else only writes the release notes into the run summary, for an upload by hand
  #
  # a job of its own, so a failed submission can be re-run without drafting the github release a second time
  store:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      STORE_MODE: ${{ (vars.STORE_SUBMISSION == 'draft' || vars.STORE_SUBMISSION == 'manual' || vars.STORE_SUBMISSION == 'immediate') && vars.STORE_SUBMISSION || '' }}
    steps:
      # the whole history, the release notes are read from the commits since the previous tag
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: download msix artifact
        uses: actions/download-artifact@v8
        with:
          name: FluentSensors_Store
          path: Setup/MsixOutput

      # pinned: the script needs submission payloads read from a file and the base price kept on publish, and
      # v0.4.3 is the first release with both
      - name: setup msstore cli
        if: env.STORE_MODE != ''
        uses: microsoft/microsoft-store-apppublisher@v1
        with:
          version: v0.4.3

      - name: sign in to partner center
        if: env.STORE_MODE != ''
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET

      - name: submit to the store
        run: ./Setup/submit-store.ps1 -Tag "${{ github.ref_name }}" -Mode "$env:STORE_MODE"
