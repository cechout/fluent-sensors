# a pull request has to compile before review, and reports its publish size; (lighter than release.yml,
# no installer, no zip, no tag)
name: pr build check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # build and format are required checks on main, so they report on every pull request, doc-only ones too
  # not with paths-ignore: a workflow skipped by path never reports and blocks the merge; a job skipped by an if reports
  # success, so the gate sits on the jobs
  # https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/defining-the-mergeability-of-pull-requests/troubleshooting-required-status-checks
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # the changed files from the api, no clone and no merge base depth to guess
      # every uncertain path sets code=true; a wrong skip would wave an unbuilt pull request through
      - name: check whether anything buildable changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename'); then
            echo "could not list the changed files, building anyway"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$changed"

          if [ -z "$changed" ]; then
            echo "no files reported, building anyway"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$changed" | grep -qvE '(\.md$|^\.github/ISSUE_TEMPLATE/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # only an explicit code=false skips; a failed filter leaves the output empty and this runs
  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: FluentSensors/FluentSensors.csproj

      - name: setup msbuild
        uses: microsoft/setup-msbuild@v3

      # --- workaround: dotnet build cannot resolve COMReference ---
      # problem: ResolveComReference exists only in the .NET Framework MSBuild (msbuild.exe),
      # dotnet build fails with MSB4803:
      # https://aka.ms/msbuild/MSB4803
      # fix: restore with the dotnet CLI, build with msbuild.exe from microsoft/setup-msbuild
      - name: restore
        run: dotnet restore FluentSensors/FluentSensors.csproj -p:Platform=x64 -r win-x64 -p:SelfContained=true

      # the build of release.yml; one pass feeds the publish and the size report
      - name: build win-x64
        run: msbuild FluentSensors/FluentSensors.csproj -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true

      # publish makes the size real (PruneUnusedPublishPayload runs after Publish); NoBuild reuses the pass above and
      # proves the publish path before a tag depends on it
      - name: publish win-x64
        run: msbuild FluentSensors/FluentSensors.csproj -t:Publish -p:Configuration=Release -p:Platform=x64 -p:PublishProfile=FolderProfile -p:NoBuild=true

      # absolute numbers (a diff would build main too); the ten largest files explain a jump
      - name: report publish size
        shell: pwsh
        run: |
          $publishDir = "FluentSensors/bin/x64/Release/net10.0-windows10.0.19041.0/publish/win-x64"
          $root = (Resolve-Path $publishDir).Path
          $files = Get-ChildItem $root -Recurse -File
          $total = ($files | Measure-Object -Property Length -Sum).Sum

          $lines = @()
          $lines += "## Publish payload"
          $lines += ""
          $lines += "Total: **$([math]::Round($total / 1MB, 2)) MB** across $($files.Count) files"
          $lines += ""
          $lines += "| Largest files | Size |"
          $lines += "| :--- | ---: |"
          foreach ($file in $files | Sort-Object Length -Descending | Select-Object -First 10)
          {
            $name = $file.FullName.Substring($root.Length + 1)
            $lines += "| $name | $([math]::Round($file.Length / 1MB, 2)) MB |"
          }

          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host "Publish payload: $([math]::Round($total / 1MB, 2)) MB"

  format:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      # no cache; format does not reliably fill the packages folder the cache saves
      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # whitespace only, per the .editorconfig; no -p:Platform (format answers it with its usage and a failure)
      # end_of_line = lf holds because .gitattributes pins the checkout; the runner autocrlf would fail every line
      - name: dotnet format whitespace check
        run: dotnet format whitespace FluentSensors/FluentSensors.csproj --verify-no-changes --verbosity diagnostic
