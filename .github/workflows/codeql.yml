# CodeQL security scanning, advanced setup with a manual build
# no autobuild; WinUI 3 needs the full build pass of release.yml (MarkupCompilePass2 resolves
# x:Bind against the LocalAssembly)
name: codeql

# not a required check, so a path filter leaves nothing pending (unlike pr-build.yml)
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
  schedule:
    - cron: "24 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: initialize codeql
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: setup msbuild
        uses: microsoft/setup-msbuild@v3

      # --- workaround: dotnet build cannot resolve COMReference ---
      # problem: ResolveComReference exists only in the .NET Framework MSBuild (msbuild.exe),
      # dotnet build fails with MSB4803:
      # https://aka.ms/msbuild/MSB4803
      # fix: restore with the dotnet CLI, build with msbuild.exe from microsoft/setup-msbuild
      - name: restore
        run: dotnet restore FluentSensors/FluentSensors.csproj -p:Platform=x64 -r win-x64 -p:SelfContained=true

      - name: build win-x64
        run: msbuild FluentSensors/FluentSensors.csproj -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true

      - name: perform codeql analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
