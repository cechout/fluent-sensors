# copies the intro and changelog of a finished github release into the store draft of release.yml; submitting
# stays a click in partner center
# runs on publish; by hand (actions, run workflow) on a draft release it gets the submission into certification
# before the release goes public
name: store release notes

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.7.0"
        required: true

jobs:
  notes:
    if: vars.STORE_SUBMISSION == 'draft'
    runs-on: windows-latest
    timeout-minutes: 15
    # write, since a draft release is visible only with push access
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7

      # the version of the upload in release.yml
      - name: setup msstore cli
        uses: microsoft/microsoft-store-apppublisher@v1
        with:
          version: v0.4.3

      - name: sign in to partner center
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET

      - name: copy the release notes into the store draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: ./Setup/submit-store.ps1 -Tag $env:TAG -ReleaseNotes
