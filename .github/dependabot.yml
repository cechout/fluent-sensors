version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # the windows app sdk components move with the metapackage in one pull request
      # the csproj excludes .AI, .ML, .Widgets and Microsoft.Windows.AI.MachineLearning, whose fragments still feed
      # the regfree WinRT manifest; one bumped alone declares classes in missing binaries ("side-by-side
      # configuration is incorrect")
      # first on purpose, dependabot takes the first matching group and minor-and-patch would swallow the minor bumps
      windows-app-sdk:
        patterns:
          - "Microsoft.WindowsAppSDK"
          - "Microsoft.WindowsAppSDK.*"
          - "Microsoft.Windows.AI.MachineLearning"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
