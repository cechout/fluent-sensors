version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # the windows app sdk is bumped by hand on a branch: the csproj excludes .AI, .ML, .Search, .Widgets and
    # Microsoft.Windows.AI.MachineLearning, whose fragments still feed the regfree WinRT manifest, the Widgets version
    # is pinned again in the widget provider and the msix payload, and a new component has to be excluded too;
    # a bump pull request can do none of that
    ignore:
      - dependency-name: "Microsoft.WindowsAppSDK"
      - dependency-name: "Microsoft.WindowsAppSDK.*"
      - dependency-name: "Microsoft.Windows.AI.MachineLearning"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
