version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # the windows app sdk components have to move together with the metapackage, in one pull request
      #
      # the csproj deselects .AI, .ML and .Widgets plus Microsoft.Windows.AI.MachineLearning via
      # ExcludeAssets, and the self-contained targets build the embedded regfree WinRT manifest from the
      # package fragments those still ship; if one of them is bumped on its own the manifest ends up
      # declaring activatable classes in binaries that are no longer there, and the app fails to start
      # with "side-by-side configuration is incorrect"
      #
      # this group is listed first on purpose, dependabot puts a dependency in the first group it matches
      # and minor-and-patch below would otherwise swallow the minor bumps
      windows-app-sdk:
        patterns:
          - "Microsoft.WindowsAppSDK"
          - "Microsoft.WindowsAppSDK.*"
          - "Microsoft.Windows.AI.MachineLearning"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
